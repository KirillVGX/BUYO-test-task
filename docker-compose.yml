services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediabuyers
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Restored only on first container start (empty data dir).
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediabuyers"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB__HOST: db
      DB__PORT: 5432
      DB__NAME: mediabuyers
      DB__USER: postgres
      DB__PASSWORD: postgres
      JWT__SECRET_KEY: local-dev-secret-key-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  db_data:
